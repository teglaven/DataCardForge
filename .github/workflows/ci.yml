name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Configure & build backend
        run: |
          cmake -S backend -B backend/build -G Ninja
          cmake --build backend/build

      - name: Run cross-tier fixtures + node registry tests
        run: ctest --test-dir backend/build --output-on-failure

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The smoke run exercises the *real* compute backend (summary panel, formula
      # cards), so the C++ binary has to exist here too. Without it those checks would
      # only ever prove the "backend unreachable" banner renders.
      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Build compute backend
        working-directory: .
        run: |
          cmake -S backend -B backend/build -G Ninja
          cmake --build backend/build

      - name: Start compute backend
        working-directory: .
        run: |
          ./backend/build/dc_backend --port 37811 &
          # Fail loudly: `curl ... && break || sleep` exits 0 after the last sleep.
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:37811/api/signatures > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: npx vite preview --port 4173 --strictPort &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: |
          # `curl ... && break || sleep 1` in a loop exits 0 after the 30th sleep, so a
          # dead preview server used to surface as a smoke failure with a confusing cause.
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ > /dev/null

      - name: End-to-end smoke test
        run: node scripts/smoke.mjs http://127.0.0.1:4173
